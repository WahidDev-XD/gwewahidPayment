<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majoris Pasar Uang - gwewahid</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a1c3a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #0f2142; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; color: #fde047; text-align: center; margin-bottom: 20px; }
        .stat-group { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-box { background: #162d55; padding: 15px; border-radius: 12px; width: 48%; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 5px; }
        .chart-container { height: 200px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Majoris Pasar Uang</h1>
    
    <div class="stat-group">
        <div class="stat-box">
            <div class="stat-label">CAGR 1Y</div>
            <div class="stat-value" style="color: #10b981;">5.04%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">AVG YIELD</div>
            <div class="stat-value">6.40%</div>
        </div>
    </div>
    
    <div class="stat-group">
        <div class="stat-box">
            <div class="stat-label">DRAWDOWN 1Y</div>
            <div class="stat-value" style="color: #ef4444;">0.00%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">RISIKO</div>
            <div class="stat-value">Rendah</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="reksaChart"></canvas>
    </div>
</div>

<script>
    // Data historis NAB (Nilai Aktiva Bersih) disesuaikan agar sesuai dengan tren 5.04% per tahun
    const ctx = document.getElementById('reksaChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
            datasets: [{
                label: 'NAB Majoris',
                data: [1200, 1205, 1212, 1218, 1225, 1230],
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.2)',
                fill: true,
                tension: 0.4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
</script>
</body>
</html>
