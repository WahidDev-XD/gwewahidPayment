<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save & Payment - Majoris Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b1f42;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #64748b;
            --accent-yellow: #fde047;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }
        *, * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(180deg, #0a1c3a 0%, #040a17 100%); color: var(--text-main); min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 24px; }
        
        /* Card Style */
        .main-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; backdrop-filter: blur(16px); }
        .info-block { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .info-details p { font-size: 11px; text-transform: uppercase; color: var(--text-muted); }
        .info-details h3 { font-size: 22px; font-weight: 700; }
        
        /* Chart & Rate */
        .chart-wrapper { width: 100%; height: 180px; margin-top: 10px; }
        .rate-value { font-size: 24px; font-weight: 800; color: var(--accent-green); }
        
        /* Payment Section */
        .payment-title { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 10px; }
        .payment-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: 0.2s; }
        .payment-card:hover { background: rgba(255,255,255,0.08); }
        
        /* Config Panel */
        .config-btn { background: var(--accent-blue); color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header" style="text-align:center;">
        <h1>gwewahid</h1>
        <h2 style="color:var(--accent-yellow); font-size: 14px;">Save & Payment System</h2>
    </div>

    <div class="main-card">
        <div class="info-block">
            <div class="info-details">
                <p>Saldo Reksadana</p>
                <h3 id="display-saldo">Rp 0</h3>
            </div>
        </div>
        <div class="info-block">
            <div class="info-details">
                <p>Pengeluaran</p>
                <h3 id="display-pengeluaran">Rp 0</h3>
            </div>
        </div>
        <div style="border-top:1px solid rgba(255,255,255,0.1); margin: 15px 0;"></div>
        <p style="font-size: 10px; color: var(--text-muted);">MAJORIS PASAR UANG INDONESIA</p>
        <h2 class="rate-value" id="nab-rate">Loading...</h2>
        <div class="chart-wrapper"><canvas id="lineChartCanvas"></canvas></div>
    </div>

    <h3 class="payment-title">MY PAYMENT</h3>
    <div id="payment-list">
        <div class="payment-card" onclick="alert('QRIS Link Ready')"><h4>QRIS</h4></div>
        <div class="payment-card" onclick="alert('SeaBank Details')"><h4>SeaBank</h4></div>
        <div class="payment-card" onclick="alert('DANA Details')"><h4>DANA</h4></div>
    </div>

    <div class="main-card">
        <h5>Kustomisasi Data</h5>
        <input type="text" id="input-saldo" placeholder="Input Saldo" style="width:100%; padding:8px; margin-top:10px;">
        <input type="text" id="input-pengeluaran" placeholder="Input Pengeluaran" style="width:100%; padding:8px; margin-top:10px;">
        <button class="config-btn" onclick="saveData()">Simpan Perubahan</button>
    </div>
</div>

<script>
    // 1. Data Reksadana Majoris (Simulasi Performa)
    function initApp() {
        const data = [1200, 1210, 1225, 1240, 1255, 1270, 1285];
        document.getElementById('nab-rate').innerText = `Rp ${data[data.length-1].toLocaleString('id-ID')}`;
        
        // Load local storage
        document.getElementById('display-saldo').innerText = `Rp ${localStorage.getItem('saldo') || '0'}`;
        document.getElementById('display-pengeluaran').innerText = `Rp ${localStorage.getItem('pengeluaran') || '0'}`;

        renderChart(data);
    }

    function renderChart(data) {
        const ctx = document.getElementById('lineChartCanvas').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul'], datasets: [{ data: data, borderColor: '#10b981', fill: true, backgroundColor: 'rgba(16, 185, 129, 0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function saveData() {
        localStorage.setItem('saldo', document.getElementById('input-saldo').value);
        localStorage.setItem('pengeluaran', document.getElementById('input-pengeluaran').value);
        location.reload();
    }

    window.onload = initApp;
</script>
</body>
</html>
